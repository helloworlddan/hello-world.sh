steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/image
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/image
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - --region=europe-north1
      - --image=gcr.io/$PROJECT_ID/image
      - hwsh
options:
  logging: CLOUD_LOGGING_ONLY

